development:
  adapter: redis
  url: <%= ENV.fetch("MW_REDIS_URL", "redis://127.0.0.1:6387/0") %>
  channel_prefix: mapping_workbench_development
test:
  adapter: <%= ENV["MW_REAL_WORKER"] == "1" ? "redis" : "test" %>
  url: <%= ENV.fetch("MW_REDIS_URL", "redis://127.0.0.1:6387/1") %>
  channel_prefix: mapping_workbench_test
production:
  adapter: redis
  url: <%= ENV.fetch("MW_REDIS_URL", "redis://127.0.0.1:6387/0") %>
  channel_prefix: mapping_workbench_production
